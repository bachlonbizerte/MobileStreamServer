plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wevent.mobilestream'
    compileSdk 36

    defaultConfig {
        applicationId 'com.wevent.mobilestream'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '4.0'
        buildConfigField 'String', 'UPDATE_REPO', '\"' + (project.findProperty('MSS_UPDATE_REPO') ?: '') + '\"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libmediamtx.so']
        }
    }
}
