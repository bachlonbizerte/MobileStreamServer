name: Build Mobile Stream Server V4

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build MediaMTX for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.21.4 https://github.com/bluenviron/mediamtx.git /tmp/mediamtx
          cd /tmp/mediamtx
          go generate ./...
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w -checklinkname=0" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmediamtx.so" .
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmediamtx.so"
          chmod 755 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmediamtx.so"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify MediaMTX inside APK
        run: |
          set -euo pipefail
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libmediamtx.so'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileStreamServer-V4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
